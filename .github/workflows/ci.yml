name: CI
# Tests every PR and every push to main. Deploys aren't done here: Cloudflare Workers Builds deploys
# whatever reaches main, without waiting for these results, so check them before merging.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - name: Check the Worker builds
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/tracker-dist"

      # 3.9 is what macOS ships, so it's the oldest version laptops run the collector on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Python 3.9 tests
        run: |
          (cd collector && python -m unittest -b test_collect)
          python -m unittest test_tracker
          (cd scripts && python -m unittest -b test_live_check test_weekly_status)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 3.12 tests
        run: |
          (cd collector && python -m unittest -b test_collect)
          python -m unittest test_tracker
          (cd scripts && python -m unittest -b test_live_check test_weekly_status)
