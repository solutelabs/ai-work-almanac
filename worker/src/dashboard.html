<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141210'/%3E%3Crect x='6' y='17' width='5' height='9' fill='%23f6f6f2'/%3E%3Crect x='13.5' y='11' width='5' height='15' fill='%23f6f6f2'/%3E%3Crect x='21' y='6' width='5' height='20' fill='%23e8a317'/%3E%3C/svg%3E">
<style>
@font-face { font-family: "Archivo Narrow"; src: url("/fonts/archivo-narrow.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Archivo"; src: url("/fonts/archivo.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
:root {
  color-scheme: light;
  --paper: #f6f6f2; --ink: #141210; --ink-2: #55504a; --rule: rgba(20,18,16,.3); --hover: rgba(20,18,16,.06);
  --vermilion: #c81f18; --saffron: 232,163,23;
  --narrow: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
::selection { background: var(--ink); color: var(--paper); }
html { scrollbar-color: var(--ink-2) transparent; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 Archivo, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; text-underline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

header.top { display: flex; flex-wrap: wrap; gap: .75rem 2rem; justify-content: space-between; align-items: flex-end; padding: 16px 32px; border-bottom: 3px solid var(--ink); }
h1 { margin: 0; font: 700 26px/1.1 var(--narrow); letter-spacing: -.005em; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem .75rem; }
.filters label { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
select { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 5px 8px; min-width: 8.5rem; max-width: 15rem; }
select:hover { background: var(--hover); }

.range { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; margin-bottom: 14px; }
.range .link { margin-left: auto; }
.range h2 { margin: 0; font: 700 34px/1.05 var(--narrow); }
.range p { margin: 0; color: var(--ink-2); }
.dow, .weeks { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow div { font: 600 13px var(--narrow); padding: 3px 8px; border-bottom: 2px solid var(--ink); }
.dow div:first-child { color: var(--vermilion); }
.day { position: relative; min-height: 112px; min-width: 0; padding: 6px 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; overflow: hidden; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); transition: background-color 180ms ease-out; }
.weeks > :nth-child(7n) { border-right: 0; }
button.day:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.num { font: 700 38px/1 var(--narrow); }
.num small { display: inline; margin-left: 4px; font: 600 13px/1.1 var(--narrow); }
.sun .num { color: var(--vermilion); }
.quiet .num { color: rgba(20,18,16,.32); }
.sun.quiet .num { color: rgba(200,31,24,.42); }
.facts { font-size: 11.5px; line-height: 1.35; white-space: nowrap; }
.day-prompts { font-size: 12px; white-space: nowrap; }
.day-prompts b { font-weight: 600; }
.today .num { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; }
.compact .day { min-height: 46px; padding: 3px 6px; flex-direction: row; justify-content: space-between; align-items: flex-end; }
.compact .num { font-size: 24px; }
.compact .num small { display: inline; font-size: 11px; margin-left: 3px; }
.compact .facts { display: none; }
.key { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--ink-2); font-size: 12px; }
.key i { width: 90px; height: 10px; background: linear-gradient(to right, rgba(var(--saffron), 0), rgba(var(--saffron), .85)); border: 1px solid var(--rule); }

h3 { margin: 0 0 6px; font: 700 21px/1.15 var(--narrow); }
.person { display: grid; gap: 1px; width: 100%; padding: 9px 8px; margin: 0 -8px; width: calc(100% + 16px); border-top: 1px solid var(--rule); }
button.person:hover { background: var(--hover); }
.person[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.person[aria-pressed="true"] .sub { color: var(--paper); }
.person b { font-size: 15px; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
.tile { display: grid; align-content: start; gap: 2px; padding: 10px 14px; border-left: 1px solid var(--rule); min-width: 0; }
.tile:first-child { border-left: 0; padding-left: 0; }
.tile-label { font: 600 13px var(--narrow); }
.tile b { font: 700 34px/1.05 var(--narrow); }
.tile b.alert { color: var(--vermilion); }
.attention { margin: 0; padding: 0; list-style: none; }
.attention > li { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.attention > li > b { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 0 12px; margin: 0; padding: 0; list-style: none; }
.link { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--ink); }
.days { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.days.open { grid-template-columns: minmax(0, 1fr) 360px; }
details { border-top: 1px solid var(--ink); }
details:last-of-type { border-bottom: 1px solid var(--ink); }
summary { cursor: pointer; padding: 10px 0; font: 700 19px var(--narrow); }
details > div { padding-bottom: 20px; display: grid; gap: 22px; }
.folds { display: block; }
dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 72ch); gap: 6px 18px; }
dt { font-weight: 600; }
dd { margin: 0; color: var(--ink-2); }
.detail { padding-left: 18px; border-left: 1px solid var(--ink); }
.detail-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.detail-head button { text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.detail .person { margin: 0; width: 100%; padding: 7px 0; }

.below { padding: 26px 32px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; max-width: 1500px; }
.below h2 { margin: 0 0 4px; font: 700 26px/1.1 var(--narrow); }
.harness { margin: 0; padding: 0; list-style: none; }
.dot { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; }
.dot.green { background: #16803c; }
.dot.red { background: var(--vermilion); }
.dot.grey { background: #a8a29e; }
.note { margin: 2px 0 8px; color: var(--ink-2); font-size: 13px; max-width: 80ch; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th:first-child, td:first-child { padding-left: 0; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--paper); }
thead th { font: 600 13px var(--narrow); vertical-align: bottom; border-bottom: 2px solid var(--ink); }
tbody tr:hover { background: var(--hover); }
.n { text-align: right; }
td.wrap, th.wrap { white-space: normal; min-width: 11rem; max-width: 22rem; }
.tip { display: inline-block; width: 16px; height: 16px; margin-left: 4px; border: 1px solid var(--ink-2); border-radius: 50%; font: 600 11px/14px Archivo, sans-serif; text-align: center; color: var(--ink-2); position: relative; }
.tip::after { content: ""; position: absolute; inset: -8px; }
.tip:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tip-text { position: fixed; inset: auto; margin: 0; width: 280px; padding: 8px 10px; background: var(--ink); color: var(--paper); border: 0; font: 400 13px/1.35 Archivo, sans-serif; white-space: normal; text-align: left; }
th.hour, td.hour { padding: 2px 1px; width: 30px; min-width: 30px; font-size: 11px; text-align: center; }
.prompt-view { margin: 12px 0 18px; padding: 12px 14px; border: 1px solid var(--ink); }
.detail details, .detail details:last-of-type { border: 0; margin-top: 4px; }
.detail summary { padding: 2px 0; font: 600 13px Archivo, sans-serif; }
.detail details > div { padding: 6px 0 4px; }
.lanes { display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 8px; }
.lane-title { height: 24px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.lane-track { position: relative; height: 480px; background: repeating-linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px 60px); }
.hours-lane .lane-track { background: none; }
.hour-label { position: absolute; left: 0; margin-top: -7px; font-size: 11px; color: var(--ink-2); }
.lane-track .typed, .lane-track .run { position: absolute; left: 0; right: 0; min-height: 2px; }
.lane-track .typed { background: rgb(var(--saffron)); }
.lane-track .run { background: rgba(var(--saffron), .35); }
.lane-track .commit { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink); }
.stretches { margin: 16px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.stretches li { padding: 3px 0; border-top: 1px solid var(--rule); }
.stretches b { font-weight: 600; }
.sub.compare { color: var(--ink); font-weight: 600; }
.prompt { padding: 10px 0; border-top: 1px solid var(--rule); }
.prompt-text { margin-top: 3px; max-height: 22em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
td.timeline-cell, th.timeline-cell { width: 45%; min-width: 360px; }
.timeline { position: relative; height: 18px; background: repeating-linear-gradient(to right, var(--hover) 0 1px, transparent 1px calc(100% / 24)); }
.timeline span { position: absolute; top: 0; bottom: 0; }
.timeline .run, .swatch.run { background: rgba(var(--saffron), .35); }
.timeline .typed, .swatch.typed { background: rgb(var(--saffron)); min-width: 2px; }
.timeline .commit, .swatch.commit { background: var(--ink); width: 2px; }
.timeline-axis { position: relative; height: 16px; }
.timeline-axis span { position: absolute; font-weight: 400; }
.swatch { display: inline-block; width: 12px; height: 12px; }
.swatch.commit { width: 2px; }
.key .swatch:not(:first-child) { margin-left: 10px; }
td.hour div { height: 22px; outline: 1px solid var(--hover); outline-offset: -1px; }
.warn { color: var(--vermilion); display: inline-flex; gap: .3rem; align-items: center; white-space: normal; }
.warn svg { width: 14px; height: 14px; flex: none; }
.loading { opacity: .55; transition: opacity 150ms ease-out; }
.message { padding: 2rem 32px; max-width: 65ch; font-size: 16px; }
.message.error { color: var(--vermilion); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: .1rem .3rem; }

@media (max-width: 1040px) {
  .days.open { grid-template-columns: minmax(0, 1fr); }
  .detail { padding-left: 0; border-left: 0; }
}
@media (max-width: 720px) {
  header.top, .below { padding-left: 16px; padding-right: 16px; }
  .filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; }
  select { width: 100%; min-width: 0; }
  .range h2 { font-size: 30px; }
  .day { min-height: 56px; padding: 4px; }
  .num { font-size: 26px; }
  .facts, .day-prompts span { display: none; }
  .dow div { padding: 3px 4px; }
  dl { grid-template-columns: minmax(0, 1fr); }
  dd { margin-bottom: 8px; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Pulse</h1>
  <div class="filters">
    <label>Period
      <select id="days">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="0">All time</option>
      </select>
    </label>
    <label>Tool <select id="tool"></select></label>
    <label>Model <select id="model"></select></label>
    <label>Project <select id="repo"></select></label>
    <label>Person <select id="developer"></select></label>
  </div>
</header>
<main id="content" aria-live="polite"><p class="message">Loading…</p></main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const TOOL_LABEL = { "claude-code": "Claude Code", codex: "Codex" };
const toolLabel = (t) => TOOL_LABEL[t] ?? t;
const number = (n) => (n === null || n === undefined ? "–" : Number(n).toLocaleString());
const percent = (part, whole) => (whole ? Math.round((100 * part) / whole) + "%" : "–");
const compact = (n) => new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n);
const hours = (n) => `${n < 10 ? n.toFixed(1) : Math.round(n).toLocaleString()} h`;
const plural = (n, word) => `${number(n)} ${word}${n === 1 ? "" : "s"}`;
const people = (n) => `${number(n)} ${n === 1 ? "person" : "people"}`;
// Your org's repos show the short name; others keep their org so client and personal repos stand out.
// Your own orgs' repos (ALLOWED_ORGS) show without the org.
const repoName = (r) => (r === "-/no-repo" ? "No repo" : data?.orgs?.includes(r.split("/")[0]) ? r.split("/").pop() : r);
const COMPACT_WEEKS = 6, REFRESH_MS = 5 * 60000, GIT_STALE_MS = 2 * 3600000;
const stamp = (at) => `${new Date(at).toLocaleString(undefined, { timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "short" })} IST`;
const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const utc = (day) => new Date(day + "T00:00:00Z");
const iso = (date) => date.toISOString().slice(0, 10);
const istToday = () => iso(new Date(Date.now() + 5.5 * 3600000));
const formatDay = (day, options) => utc(day).toLocaleDateString("en-GB", { timeZone: "UTC", ...options });

// Built with DOM calls, never innerHTML: names and repos come from laptops and commit history.
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else node.setAttribute(key, value);
  }
  node.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
  return node;
}
function warningIcon() {
  const ns = "http://www.w3.org/2000/svg";
  const icon = document.createElementNS(ns, "svg");
  icon.setAttribute("viewBox", "0 0 16 16");
  icon.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(ns, "path");
  for (const [k, v] of Object.entries({ d: "M8 1.5 15 14H1L8 1.5Zm0 4.5v4m0 2v.5", fill: "none", stroke: "currentColor", "stroke-width": "1.5", "stroke-linejoin": "round", "stroke-linecap": "round" })) path.setAttribute(k, v);
  icon.append(path);
  return icon;
}

// hours:start. Kept as plain functions so worker/test/hours.test.js can run them.
const DAY_MS = 86400000, STUCK_DAYS = 7;
const SLOT_HOURS = 5 / 60;
const slotBits = (list) => (list ?? "").split(",").filter(Boolean).reduce((all, hex) => all | BigInt("0x" + hex), 0n);
const countSlots = (text) => text.replace(/0/g, "").length;
// Prompts up to 15 minutes apart count as one stretch of attention: someone is reading and thinking between them.
const handsOnSlots = (bits) => countSlots(bits.toString(2).replace(/(?<=1)0{1,2}(?=1)/g, (gap) => "1".repeat(gap.length)));
// One person's minutes count once however many sessions overlap, then people add up.
function timeBy(rows, keyOf) {
  const cells = new Map();
  for (const u of rows) {
    if (!u.active) continue;
    const id = `${keyOf(u)}\n${u.developer}\n${u.day}`;
    const cell = cells.get(id) ?? cells.set(id, { key: keyOf(u), active: 0n, prompted: 0n, prompts: 0, seen: 0n, parallel: 0n, folders: new Map() }).get(id);
    cell.active |= slotBits(u.active);
    cell.prompted |= slotBits(u.prompted);
    cell.prompts += u.prompts ?? 0;
    const folders = (u.folders ?? "").split(",").filter(Boolean);
    folders.forEach((folder) => { if (!cell.folders.has(folder)) cell.folders.set(folder, 0n); });
    // A session that moved between folders still did one thing at a time, so it counts under its first.
    if (folders.length) cell.folders.set(folders[0], cell.folders.get(folders[0]) | slotBits(u.active));
  }
  const totals = new Map();
  for (const cell of cells.values()) {
    const total = totals.get(cell.key) ?? totals.set(cell.key, { running: 0, handsOn: 0, prompts: 0, parallel: 0, worktrees: new Set(), folders: new Set() }).get(cell.key);
    const running = countSlots(cell.active.toString(2));
    total.running += running * SLOT_HOURS;
    total.handsOn += Math.min(handsOnSlots(cell.prompted), running) * SLOT_HOURS;
    total.prompts += cell.prompts;
    // Blocks where two or more separate folders had AI activity at once.
    for (const [folder, bits] of cell.folders) {
      cell.parallel |= cell.seen & bits;
      cell.seen |= bits;
      total.folders.add(folder);
      if (folder.startsWith("w")) total.worktrees.add(folder);
    }
    total.parallel += countSlots(cell.parallel.toString(2)) * SLOT_HOURS;
  }
  return totals;
}
function median(values) {
  if (!values.length) return null;
  const sorted = [...values].sort((a, b) => a - b), middle = sorted.length >> 1;
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}
// Dotted numeric parts, so 0.10.0 sorts after 0.9.0.
const newerVersion = (a, b) => (b ?? "").localeCompare(a ?? "", undefined, { numeric: true }) > 0;
// What each person used most recently per tool, flagged when behind the newest anyone here used.
function latestToolVersions(rows) {
  const latest = new Map(), newest = new Map();
  for (const u of rows) {
    if (!u.tool_version) continue;
    if (newerVersion(newest.get(u.tool), u.tool_version)) newest.set(u.tool, u.tool_version);
    const key = `${u.developer}\n${u.tool}`, seen = latest.get(key);
    if (!seen || u.day > seen.day || (u.day === seen.day && newerVersion(seen.version, u.tool_version))) latest.set(key, { person: u.developer, tool: u.tool, version: u.tool_version, day: u.day });
  }
  return [...latest.values()].map((r) => ({ ...r, behind: newerVersion(r.version, newest.get(r.tool)) }))
    .sort((a, b) => a.tool.localeCompare(b.tool) || b.behind - a.behind || a.person.localeCompare(b.person));
}
const IST_MS = 5.5 * 3600000, AI_WINDOW_SLOTS = 36n, SLOTS_PER_DAY = 288n, FULL_DATA_COLLECTOR = "0.7.2";
// Sorts commits by how much is known about AI's part in them. "noAi" is only ever said when every laptop
// the person has was reporting at the time, because no data must never read as manual work.
// shortcut: AI activity the day before a period starts isn't loaded, so a commit just after that can read as noAi; only the first hours of a period.
function classifyCommits(commits, usage, machines) {
  const active = new Map();
  const blocks = (person, repo, day) => active.get(`${person}\n${repo}\n${day}`) ?? 0n;
  for (const u of usage) {
    if (!u.active || !u.ist) continue;
    active.set(`${u.developer}\n${u.repo}\n${u.day}`, blocks(u.developer, u.repo, u.day) | slotBits(u.active));
  }
  const reported = new Map(); // each person's window that all their laptops cover: { from day, until time }
  for (const m of machines) {
    const seen = reported.get(m.developer) ?? { from: "", until: Infinity };
    const ready = !newerVersion(m.version, FULL_DATA_COLLECTOR) && m.first_ist_day;
    reported.set(m.developer, ready
      ? { from: m.first_ist_day > seen.from ? m.first_ist_day : seen.from, until: Math.min(seen.until, Date.parse(m.last_seen)) }
      : { from: "9999", until: -Infinity });
  }
  const dayOf = (ms) => new Date(ms).toISOString().slice(0, 10);
  for (const c of commits) {
    const when = Date.parse(c.authored_at), local = when + IST_MS, day = dayOf(local);
    const slot = BigInt(Math.floor((local % 86400000) / 300000));
    c.day = day;
    c.stage = commitStage(c);
    // Two days side by side, so the window can reach back past midnight.
    const days = blocks(c.person, c.repo, dayOf(local - 86400000)) | (blocks(c.person, c.repo, day) << SLOTS_PER_DAY);
    const nearby = (days >> (SLOTS_PER_DAY + slot - AI_WINDOW_SLOTS)) & ((1n << (AI_WINDOW_SLOTS + 1n)) - 1n);
    const covered = reported.get(c.person);
    c.kind = c.ai ? "marked" : nearby ? "nearby" : covered && day >= covered.from && when <= covered.until ? "noAi" : "unknown";
  }
}
// Logged time from solidtime, added up by whatever the key is.
function logBy(rows, keyOf) {
  const totals = new Map();
  for (const t of rows) {
    const key = keyOf(t);
    const total = totals.get(key) ?? totals.set(key, { hours: 0, days: new Set(), people: new Set(), repos: new Set() }).get(key);
    total.hours += t.seconds / 3600;
    total.days.add(t.day);
    total.people.add(t.person);
    t.repos.split(",").filter(Boolean).forEach((repo) => total.repos.add(repo));
  }
  return totals;
}
// Days on leave per person, and how many had work on them. A half day off can have work, so only full days count.
function leaveBy(leave, workDaysOf) {
  const totals = new Map();
  for (const l of leave) {
    const total = totals.get(l.person) ?? totals.set(l.person, { days: 0, workedOn: 0 }).get(l.person);
    total.days += l.portion;
    if (l.portion === 1 && workDaysOf(l.person).has(l.day)) total.workedOn += 1;
  }
  return totals;
}
// Projects sharing a repo become one row: the repo's activity can't be split between them, so separate rows would repeat it.
function projectGroups(timeLog, repos) {

function collectorIssues(m, latest) {
  const issues = [];
  if (newerVersion(m.version, latest)) issues.push(`Old version: needs a re-install to reach ${latest}`);
  if (Date.now() - new Date(m.last_seen).getTime() > 48 * 3600000) issues.push("Not heard from in over 2 days");
  if (!m.usage_rows) issues.push("Installed, nothing collected yet");
  if (m.unrecognized_files) issues.push(`Log format not recognised in ${plural(m.unrecognized_files, "file")}`);
  if (m.parse_errors) issues.push(`${plural(m.parse_errors, "file")} could not be read`);
  if (m.bad_lines) issues.push(`${number(m.bad_lines)} log lines could not be parsed`);
  return issues;
}

  const days = $("days").value;
  try {
    const response = await fetch(`/api/dashboard?part=findings&days=${encodeURIComponent(days)}`);
    if (!response.ok) throw new Error(String(response.status));
    const found = await response.json();
    if ($("days").value === days) secrets = { state: "ready", ...found };
  } catch {
    if ($("days").value === days) secrets = { state: "error", findings: [], partial: false };
  }
  if (data) render();
}

async function load(background = false) {
  const content = $("content");
  if (!background) content.classList.add("loading");
  try {
    const response = await fetch(`/api/dashboard?days=${encodeURIComponent($("days").value)}`);
    if (!response.ok) throw new Error(`The server answered ${response.status}`);
    data = await response.json();
    classifyCommits(data.commits, data.usage, data.machines);
    if (!background) selectedDay = null;
    render();
    if (!background) loadSecrets();
  } catch (error) {
    // A failed refresh keeps the last good view on screen.
    if (!background) content.replaceChildren(el("p", { class: "message error" }, `Could not load the data. ${error.message}. Reload the page to try again.`));
  }
  content.classList.remove("loading");
}

$("days").addEventListener("change", () => load());
setInterval(() => { if (!document.hidden) load(true); }, REFRESH_MS);
["tool", "model", "repo", "developer"].forEach((id) => $(id).addEventListener("change", render));
// The popover is fixed to the window, so it would drift away from its column on scroll.
addEventListener("scroll", () => document.querySelectorAll(".tip-text:popover-open").forEach((tip) => tip.hidePopover()), true);
addEventListener("keydown", (event) => { if (event.key === "Escape" && selectedDay) { selectedDay = null; render(); } });
load();
</script>
</body>
</html>
